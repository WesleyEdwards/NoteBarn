
[versions]
graalVmNative = "0.11.3"
kotlin = "2.3.20"
kotlinerCli = "1.0.5"
kotlinxSerializationCsvDurable = "0.2.21-1"
ksp = "2.3.6"
lightningServer = "5.0.0-wetssdkupdates-5-d9ab4856-1-local"
