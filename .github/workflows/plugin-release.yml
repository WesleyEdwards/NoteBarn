# Builds the Obsidian plugin and publishes a GitHub release when a version tag (like 0.1.1) is pushed.
# BRAT installs and updates the plugin from these releases, using the root manifest.json to find the version.
name: Plugin release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the plugin version
        run: |
          version=$(node -p "require('./plugin/manifest.json').version")
          root=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ] || [ "$root" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match plugin/manifest.json ($version) and manifest.json ($root). Run: node plugin/release.mjs $GITHUB_REF_NAME"
            exit 1
          fi

      - run: npm ci

      - name: Test
        run: npm test -w @notebarn/shared

      - name: Build
        run: npm run build -w notebarn-plugin

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Notebarn ${{ github.ref_name }}
          files: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css
